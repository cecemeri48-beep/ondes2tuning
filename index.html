<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17120E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Onde2&#8217;S">
<meta name="description" content="Tuner digital gitar, biola, bass, dan ukulele dengan mode jarum dan strobo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<title>The Onde-Onde's Chelebes — Nature Pitch Calibrator</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#F5E9D6; --ink2:rgba(245,233,214,.70); --ink3:rgba(245,233,214,.45);
    --surface:rgba(255,246,230,.055); --surface2:rgba(255,246,230,.035);
    --panel:rgba(255,246,230,.05); --line:rgba(224,174,92,.26); --line2:rgba(245,233,214,.12);
    --terra:#C2542F; --terra-lt:#E0774A; --brass:#E0AE5C; --teal:#3E8F84;
    --green:#6FC79A; --blue:#6FA8DC; --red:#E8836F;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html{height:100%}
  body{
    background:
      radial-gradient(120% 78% at 50% 4%, #2A211A 0%, #1B1511 48%, #100C09 100%);
    color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    display:flex; justify-content:center; align-items:center;
    padding:clamp(8px,1.6vh,20px) 14px calc(clamp(8px,1.6vh,20px) + env(safe-area-inset-bottom));
  }
  /* ukiran Toraja (pa'tedong) — terukir tipis warna kuningan */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.18;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128' viewBox='0 0 128 128'><g fill='none' stroke='%23E0AE5C' stroke-width='1.4'><path d='M64 6 L122 64 L64 122 L6 64 Z'/><path d='M64 26 L102 64 L64 102 L26 64 Z'/><path d='M64 46 L82 64 L64 82 L46 64 Z'/><path d='M0 64 L6 64 M122 64 L128 64 M64 0 L64 6 M64 122 L64 128'/></g><g fill='%233E8F84' opacity='.75'><circle cx='64' cy='64' r='3.4'/><circle cx='0' cy='0' r='3'/><circle cx='128' cy='0' r='3'/><circle cx='0' cy='128' r='3'/><circle cx='128' cy='128' r='3'/></g></svg>");
    background-size:128px 128px;
  }
  /* butiran kulit kayu */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.40;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
  }

  .app{position:relative; z-index:1; width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.4vh,14px)}

  /* ---- kepala merek ---- */
  .brand{position:relative; display:flex; align-items:center; gap:10px; width:100%;
    padding:10px 12px; border-radius:14px; overflow:hidden;
    background:linear-gradient(180deg,rgba(255,246,230,.07),rgba(255,246,230,.02));
    border:1px solid var(--line2);
    box-shadow:inset 0 1px 0 rgba(255,246,230,.10), 0 8px 22px rgba(0,0,0,.45)}
  /* pita tenun lipa' sabbe */
  .brand::after{content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
    background:repeating-linear-gradient(90deg,
      var(--terra) 0 14px, var(--brass) 14px 22px, var(--teal) 22px 30px,
      rgba(245,233,214,.22) 30px 34px)}
  .brand .mark{width:40px; height:40px; flex:none; display:block;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
  .brand h1{font:700 15.5px/1.2 var(--sans); color:var(--ink)}
  .brand p{font:600 9.5px/1.5 var(--sans); letter-spacing:.17em; text-transform:uppercase;
    color:var(--brass)}

  /* ---- layar utama ---- */
  .screen{position:relative; width:100%; border-radius:16px; overflow:hidden;
    border:1px solid var(--line); padding:12px 12px 10px;
    display:flex; flex-direction:column; gap:9px;
    box-shadow:inset 0 1px 0 rgba(255,246,230,.10), 0 12px 30px rgba(0,0,0,.55)}
  .scene{position:absolute; inset:0; width:100%; height:100%; z-index:0}
  .sread{position:relative; z-index:1; text-align:center; isolation:isolate}
  .sread::before{content:""; position:absolute; inset:-10px -12px -6px; z-index:-1;
    background:radial-gradient(72% 108% at 50% 48%,
      rgba(10,8,6,.72) 0%, rgba(10,8,6,.46) 54%, rgba(10,8,6,0) 80%)}
  .starget{font:700 10.5px/1.4 var(--sans); letter-spacing:.22em; text-transform:uppercase;
    color:var(--brass)}
  .snote{font:700 clamp(52px,15vw,74px)/1.02 var(--sans); letter-spacing:-.02em;
    color:#FBF0DC; margin:2px 0; font-variant-numeric:tabular-nums;
    text-shadow:0 2px 20px rgba(0,0,0,.85), 0 0 8px rgba(0,0,0,.5); transition:color .12s}
  .shz{font:500 11.5px/1.35 var(--sans); color:var(--ink2);
    font-variant-numeric:tabular-nums}
  .scents{font:700 12px/1.45 var(--sans); letter-spacing:.06em;
    color:var(--ink2); min-height:18px}

  /* ---- bilah cent mendatar ---- */
  .gauge{position:relative; z-index:1; height:58px; border-radius:10px;
    background:rgba(12,9,7,.55); border:1px solid rgba(224,174,92,.22)}
  .gzone{position:absolute; left:50%; top:0; bottom:17px; width:9.2%;
    transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(111,199,154,.28),rgba(111,199,154,.05));
    border-left:1px solid rgba(111,199,154,.45);
    border-right:1px solid rgba(111,199,154,.45)}
  .gticks{position:absolute; left:4%; right:4%; top:0; bottom:17px}
  .gticks i{position:absolute; bottom:0; width:1.4px; border-radius:1px;
    transform:translateX(-50%); background:rgba(245,233,214,.40)}
  .gticks i.mj{width:2.2px; background:rgba(245,233,214,.85)}
  .gmark{position:absolute; left:50%; top:6px; bottom:19px; width:0; z-index:2;
    will-change:left; transition:left .09s linear}
  .gmark i{position:absolute; left:50%; top:0; bottom:0; width:4px; border-radius:3px;
    transform:translateX(-50%); background:#FBEFD6;
    box-shadow:0 0 12px 3px rgba(224,174,92,.70)}
  .glabels{position:absolute; left:4%; right:4%; bottom:3px; display:flex;
    justify-content:space-between; font:600 9.5px/1 var(--sans); letter-spacing:.08em;
    color:var(--ink3); font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){ .gmark{transition:none} }

  /* ---- mode strobo ---- */
  .strobe{position:relative; z-index:1; display:none; flex-direction:column; gap:6px}
  .sband{height:27px; border-radius:9px; border:1px solid rgba(224,174,92,.20);
    background-color:rgba(12,9,7,.68);
    background-image:repeating-linear-gradient(90deg,
      var(--sc,#E6D6B6) 0 14px, rgba(0,0,0,0) 14px 28px)}
  .sband.b2{background-image:repeating-linear-gradient(90deg,
      var(--sc,#A8927099) 0 10px, rgba(0,0,0,0) 10px 20px)}

  .modes{display:flex; gap:4px; padding:4px; border-radius:11px;
    background:rgba(0,0,0,.34); border:1px solid var(--line2)}
  .modes button{width:96px; height:36px; border:1px solid transparent; border-radius:8px;
    background:transparent; color:var(--ink2); font:600 12.5px/1 var(--sans);
    letter-spacing:.04em; cursor:pointer; transition:background .15s,color .15s,border-color .15s}
  .modes button:hover{color:var(--ink); background:rgba(255,246,230,.08)}
  .modes button[aria-selected="true"]{
    background:linear-gradient(180deg,#C9683C,#9C3D1F);
    color:#FFF3E4; border-color:rgba(224,174,92,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.20), 0 2px 10px rgba(194,84,47,.35)}

  .panel{width:100%; background:var(--panel); border:1px solid var(--line2);
    border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:8px;
    box-shadow:inset 0 1px 0 rgba(255,246,230,.07), 0 8px 22px rgba(0,0,0,.42)}

  .tabs{display:flex; gap:4px}
  .tabs button{flex:1; min-width:0; height:36px; border:1px solid transparent; border-radius:8px;
    background:rgba(0,0,0,.30); color:var(--ink2); font:600 13px/1 var(--sans);
    cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s}
  .tabs button:hover{color:var(--ink); background:rgba(255,246,230,.08)}
  .tabs button[aria-selected="true"]{
    background:linear-gradient(180deg,#C9683C,#9C3D1F);
    color:#FFF3E4; border-color:rgba(224,174,92,.55);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.20)}

  select{width:100%; height:38px; padding:0 34px 0 12px; border-radius:8px;
    background:rgba(0,0,0,.30) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5l5-5' stroke='rgba(245,233,214,.60)' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 12px center;
    border:1px solid var(--line2); color:var(--ink); font:500 13.5px/1 var(--sans);
    -webkit-appearance:none; appearance:none; cursor:pointer; color-scheme:dark}
  select option{background:#1E1811; color:#F5E9D6}
  select option:checked{background:#C2542F; color:#FFF}

  .strings{display:flex; gap:5px; width:100%}
  .chip{flex:1; min-width:0; height:50px; border-radius:8px; cursor:pointer;
    background:linear-gradient(180deg,rgba(255,246,230,.09),rgba(255,246,230,.02));
    border:1px solid var(--line2); color:var(--ink2); font-family:var(--sans);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    padding:0 2px; transition:border-color .15s,background .15s,color .15s}
  .chip:hover{background:rgba(255,246,230,.13); color:var(--ink)}
  .chip .n{font:600 13.5px/1 var(--sans)}
  .chip .f{font-size:9.5px; color:var(--ink3); font-variant-numeric:tabular-nums}
  .chip.active{border-color:var(--terra-lt); background:rgba(194,84,47,.24); color:var(--ink)}
  .chip.tuned{border-color:var(--green); background:rgba(111,199,154,.20); color:var(--ink)}
  .chip.locked{border-color:var(--blue); box-shadow:inset 0 0 0 1px rgba(111,168,220,.55)}
  .chip.locked .n::after{content:"\00a0\1F512"; font-size:9px}

  /* ---- papan jari biola ---- */
  .fb{display:block; width:100%; height:auto}
  .fstr{cursor:pointer}
  .fstr .hit{fill:transparent}
  .fstr .ln{stroke:#E8DCC4; stroke-linecap:round; transition:stroke .15s,stroke-width .15s}
  .fstr .lb{fill:var(--ink); font:700 12.5px var(--sans); text-anchor:middle;
    paint-order:stroke; stroke:rgba(10,8,6,.75); stroke-width:2.6px;
    stroke-linejoin:round; transition:fill .15s}
  .fstr .hz{fill:var(--ink3); font:500 9px var(--sans); text-anchor:middle;
    paint-order:stroke; stroke:rgba(10,8,6,.65); stroke-width:2.2px; stroke-linejoin:round}
  .fstr:hover .ln{stroke:#FFF}
  .fstr:hover .lb{fill:var(--brass)}
  .fstr.active .ln{stroke:#E9A05C}
  .fstr.active .lb{fill:#F0BC6E}
  .fstr.tuned  .ln{stroke:#7FE0A6}
  .fstr.tuned  .lb{fill:#7FE0A6}
  .fstr.locked .lb{fill:var(--blue)}
  .fstr.locked .lk{opacity:1}
  .fstr .lk{opacity:0; fill:var(--blue); font-size:9px; text-anchor:middle; transition:opacity .15s}

  /* ---- kepala gitar / bass / ukulele ---- */
  .hs{display:block; width:100%; height:auto}
  .hstr{cursor:pointer}
  .hstr .hit{fill:transparent}
  .hstr .ln{stroke:#E8DCC4; stroke-linecap:round; transition:stroke .15s}
  .hstr .pb{fill:#C9A96A; stroke:rgba(0,0,0,.45); stroke-width:.7; transition:fill .15s}
  .hstr .peg{fill:#E0C48C; stroke:rgba(0,0,0,.5); stroke-width:.8; transition:fill .15s}
  .hstr .lb{fill:var(--ink); font:700 12.5px var(--sans); text-anchor:middle;
    paint-order:stroke; stroke:rgba(10,8,6,.75); stroke-width:2.6px;
    stroke-linejoin:round; transition:fill .15s}
  .hstr .hz{fill:var(--ink3); font:500 9px var(--sans); text-anchor:middle;
    paint-order:stroke; stroke:rgba(10,8,6,.65); stroke-width:2.2px; stroke-linejoin:round}
  .hstr:hover .ln{stroke:#FFF}
  .hstr:hover .peg{fill:#FBEFD6}
  .hstr:hover .lb{fill:var(--brass)}
  .hstr.active .ln{stroke:#E9A05C}
  .hstr.active .peg,.hstr.active .pb{fill:#F0BC6E}
  .hstr.active .lb{fill:#F0BC6E}
  .hstr.tuned .ln{stroke:#7FE0A6}
  .hstr.tuned .peg,.hstr.tuned .pb{fill:#7FE0A6}
  .hstr.tuned .lb{fill:#7FE0A6}
  .hstr.locked .lb{fill:var(--blue)}
  .hstr.locked .peg{fill:var(--blue)}
  .hstr.locked .lk{opacity:1}
  .hstr .lk{opacity:0; fill:var(--blue); font-size:9px; text-anchor:middle; transition:opacity .15s}

  /* ---- indikator kekuatan sinyal ---- */
  .level{width:100%; height:4px; border-radius:3px; background:rgba(0,0,0,.42); overflow:hidden}
  .level i{display:block; height:100%; width:100%; border-radius:3px;
    transform:scaleX(0); transform-origin:left center; will-change:transform;
    background:linear-gradient(90deg,#3E8F84,#6FC79A 55%,#E0AE5C);
    transition:transform .09s linear}

  .row{display:flex; gap:8px; width:100%; align-items:center}
  .start{flex:1; height:46px; border-radius:9px; cursor:pointer;
    border:1px solid rgba(224,174,92,.45); font:600 15px/1 var(--sans); letter-spacing:.02em;
    background:linear-gradient(180deg,#C9683C,#96371B); color:#FFF3E4;
    text-shadow:0 1px 1px rgba(0,0,0,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 18px rgba(150,55,27,.35);
    transition:filter .15s}
  .start:hover{filter:brightness(1.08)}
  .start.on{background:linear-gradient(180deg,rgba(255,246,230,.13),rgba(255,246,230,.04));
    color:var(--ink2); text-shadow:none; border-color:var(--line2)}

  .calib{display:flex; align-items:center; gap:1px; height:46px; flex:none;
    background:rgba(0,0,0,.30); border:1px solid var(--line2); border-radius:9px; padding:3px}
  .calib button{width:28px; height:100%; border:0; border-radius:6px; background:transparent;
    color:var(--ink2); font:400 16px/1 var(--sans); cursor:pointer}
  .calib button:hover{background:rgba(255,246,230,.10); color:var(--ink)}
  .calib b{font:600 11px/1.25 var(--sans); color:var(--ink); text-align:center;
    font-variant-numeric:tabular-nums; padding:0 2px; white-space:nowrap}
  .calib b i{display:block; font-style:normal; font-size:9px; color:var(--ink3);
    letter-spacing:.06em; text-transform:uppercase}

  .status{font-size:11.5px; color:var(--ink3); text-align:center; min-height:16px; padding:0 6px}
  .status.err{color:var(--red)}

  .modes button:focus-visible,
  .tabs button:focus-visible,.calib button:focus-visible,select:focus-visible,
  .chip:focus-visible,.start:focus-visible,.fstr:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

  @media (max-width:400px){ .chip{height:46px} .chip .n{font-size:12.5px} }
</style>
</head>
<body>
<div class="app">

  <!-- ================= EMBLEM ================= -->
  <header class="brand">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="#171310" stroke="#E0AE5C" stroke-width="1.3"/>
      <g fill="none" stroke="#E0AE5C" stroke-width="1.1" opacity=".95">
        <circle cx="29" cy="11" r="4"/>
        <path d="M29 5.4 V7 M29 15 V16.6 M23.4 11 H25 M33 11 H34.6"/>
      </g>
      <path d="M5 28 L15 13 L21 22 L26 16 L35 28 Z" fill="#2E5C46"/>
      <path d="M15 13 L18.4 18.1 L15 19.6 L11.6 18.1 Z" fill="#E7EFE9"/>
      <path d="M5 31 L20 24.5 L35 31 L20 37.5 Z" fill="none" stroke="#C2542F" stroke-width="1.3"/>
      <path d="M13.5 31 L20 28 L26.5 31 L20 34 Z" fill="#E0AE5C" opacity=".9"/>
    </svg>
    <div class="btxt">
      <h1>The Onde-Onde&#8217;s Project</h1>
      <p>Nature Pitch Calibrator</p>
    </div>
  </header>

  <div class="screen">
    <svg class="scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#141A20"/><stop offset=".52" stop-color="#1E2A2C"/>
          <stop offset="1" stop-color="#3A2E1F"/>
        </linearGradient>
        <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2C4A3B"/><stop offset="1" stop-color="#14231C"/>
        </linearGradient>
        <radialGradient id="glow" cx=".8" cy=".26" r=".55">
          <stop offset="0" stop-color="#E0AE5C" stop-opacity=".38"/>
          <stop offset="1" stop-color="#E0AE5C" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect width="400" height="240" fill="url(#sky)"/>
      <rect width="400" height="240" fill="url(#glow)"/>

      <g fill="#FBF0DC" opacity=".65">
        <circle cx="40" cy="30" r="1.2"/><circle cx="96" cy="54" r="1"/>
        <circle cx="150" cy="26" r="1.3"/><circle cx="212" cy="46" r="1"/>
        <circle cx="268" cy="24" r="1.2"/><circle cx="366" cy="74" r="1"/>
        <circle cx="22" cy="78" r=".9"/><circle cx="128" cy="70" r=".9"/>
      </g>

      <!-- pa'barre allo: rosette matahari Toraja -->
      <g transform="translate(318,52)" opacity=".85">
        <circle r="18" fill="#E0AE5C" opacity=".16"/>
        <circle r="11.5" fill="none" stroke="#E0AE5C" stroke-width="1.5" opacity=".85"/>
        <circle r="5.5" fill="#E0AE5C" opacity=".85"/>
        <g stroke="#E0AE5C" stroke-width="1.5" stroke-linecap="round" opacity=".8">
          <path d="M0 -24 V-16 M0 24 V16 M-24 0 H-16 M24 0 H16"/>
          <path d="M-17 -17 L-11.4 -11.4 M17 -17 L11.4 -11.4 M-17 17 L-11.4 11.4 M17 17 L11.4 11.4"/>
        </g>
      </g>

      <!-- kabut lembah -->
      <path d="M0 150 Q80 141 150 150 T280 148 T400 152 L400 176 L0 176 Z"
            fill="#8FB3AE" opacity=".14"/>

      <!-- punggungan belakang -->
      <path d="M0 168 L64 100 L108 140 L150 92 L206 168 Z" fill="#2E4451"/>
      <path d="M150 92 L166 113 L150 121 L134 113 Z" fill="#DCE9EE" opacity=".80"/>
      <path d="M64 100 L76 117 L64 123 L52 117 Z" fill="#DCE9EE" opacity=".62"/>
      <!-- punggungan depan -->
      <path d="M168 170 L232 106 L290 150 L336 114 L400 170 Z" fill="#22343E"/>
      <path d="M232 106 L246 125 L232 132 L218 125 Z" fill="#DCE9EE" opacity=".70"/>

      <!-- siluet tongkonan -->
      <g fill="#16221E">
        <path d="M96 166 L104 158 L112 154 L120 158 L128 166 Z"/>
        <rect x="104" y="166" width="16" height="7" rx="1.4"/>
      </g>

      <!-- dataran / sawah -->
      <rect y="166" width="400" height="74" fill="url(#field)"/>
      <path d="M0 178 Q100 169 200 180 T400 174" fill="none" stroke="#E0AE5C"
            stroke-width="2.2" opacity=".38"/>
      <path d="M0 196 Q120 188 240 199 T400 193" fill="none" stroke="#6FC79A"
            stroke-width="1.6" opacity=".28"/>

      <!-- pita ukiran pa'tedong -->
      <rect y="208" width="400" height="32" fill="#12100C" opacity=".55"/>
      <rect y="208" width="400" height="1.2" fill="#E0AE5C" opacity=".45"/>
      <g fill="none" stroke="#E0AE5C" stroke-width="1.3" opacity=".45">
        <path d="M10 224 L26 212 L42 224 L26 236 Z M26 224 m-6.5 0 l6.5 -5.5 l6.5 5.5 l-6.5 5.5 Z"/>
        <path d="M58 224 L74 212 L90 224 L74 236 Z M74 224 m-6.5 0 l6.5 -5.5 l6.5 5.5 l-6.5 5.5 Z"/>
        <path d="M106 224 L122 212 L138 224 L122 236 Z M122 224 m-6.5 0 l6.5 -5.5 l6.5 5.5 l-6.5 5.5 Z"/>

        <path d="M202 224 L218 212 L234 224 L218 236 Z M218 224 m-6.5 0 l6.5 -5.5 l6.5 5.5 l-6.5 5.5 Z"/>

<script>
"use strict";

/* ============================================================
   1. DATA — tiap instrumen cuma beda daftar nomor MIDI senar
   ============================================================ */
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const INSTRUMENTS = {
  gitar: { label:"Gitar", icon:"guitar", presets:[
    { name:"Standard  E A D G B E", midi:[40,45,50,55,59,64] },
    { name:"Drop D  D A D G B E",   midi:[38,45,50,55,59,64] },
    { name:"Half-step down  Eb",    midi:[39,44,49,54,58,63] },
    { name:"Open G  D G D G B D",   midi:[38,43,50,55,59,62] },
    { name:"DADGAD",                midi:[38,45,50,55,57,62] },
  ]},
  biola: { label:"Biola", icon:"violin", presets:[
    { name:"Biola — G D A E", midi:[55,62,69,76] },
    { name:"Viola — C G D A", midi:[48,55,62,69] },
    { name:"Cello — C G D A", midi:[36,43,50,57] },
  ]},
  bass: { label:"Bass", icon:"guitar", presets:[
    { name:"Bass 4 senar — E A D G",   midi:[28,33,38,43] },
    { name:"Bass 5 senar — B E A D G", midi:[23,28,33,38,43] },
  ]},
  ukulele: { label:"Ukulele", icon:"guitar", presets:[
    { name:"Sopran/Konser — G C E A", midi:[67,60,64,69] },
    { name:"Bariton — D G B E",       midi:[50,55,59,64] },
  ]},
};

/* ============================================================
   2. MATEMATIKA NADA
   ============================================================ */
let A4 = 440;
const midiToFreq   = m => A4 * Math.pow(2, (m - 69) / 12);
const centsBetween = (f, ref) => 1200 * Math.log2(f / ref);
const midiToName   = m => ({ name: NOTE_NAMES[((m % 12) + 12) % 12], oct: Math.floor(m / 12) - 1 });

/* ============================================================
   3. DETEKSI PITCH — algoritma YIN
   Identik untuk gitar, biola, bass, ukulele.
   ============================================================ */
/* Batas frekuensi menyesuaikan instrumen (diisi updateBandLimits).
   Gitar mulai ~58 Hz sehingga dengung kipas & hum listrik 50 Hz tidak ikut terbaca,
   sementara bass 5 senar tetap bisa turun sampai ~22 Hz. */
let detMinF = 30, detMaxF = 1500, lastRms = 0;
const RMS_GATE = 0.013;
let _yinD = null, _yinC = null;                              // gerbang volume

function detectPitch(buf, sr){
  let rms = 0;
  for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  lastRms = rms = Math.sqrt(rms / buf.length);
  if (rms < RMS_GATE) return -1;

  const maxTau = Math.min(Math.floor(sr / detMinF), buf.length >> 1);
  const minTau = Math.max(2, Math.floor(sr / detMaxF));
  const W = Math.min(2048, buf.length - maxTau);
  if (W < 512) return -1;

  if (!_yinD || _yinD.length < maxTau){ _yinD = new Float32Array(maxTau); _yinC = new Float32Array(maxTau); }
  const d = _yinD, cm = _yinC;                       // (a) difference function
  d.fill(0, 0, maxTau);
  for (let tau = 1; tau < maxTau; tau++){
    let sum = 0;
    for (let i = 0; i < W; i++){ const dd = buf[i] - buf[i + tau]; sum += dd * dd; }
    d[tau] = sum;
  }

  // (b) cumulative mean normalized
  cm[0] = 1; let run = 0;
  for (let tau = 1; tau < maxTau; tau++){
    run += d[tau];
    cm[tau] = run > 0 ? (d[tau] * tau / run) : 1;
  }

  let tau = -1;                                      // (c) absolute threshold
  for (let t = minTau; t < maxTau - 1; t++){
    if (cm[t] < 0.12){
      while (t + 1 < maxTau && cm[t + 1] < cm[t]) t++;
      tau = t; break;
    }
  }
  if (tau < 0){
    let best = minTau;
    for (let t = minTau; t < maxTau; t++) if (cm[t] < cm[best]) best = t;
    if (cm[best] > 0.45) return -1;
    tau = best;
  }

  // (c2) penjaga oktaf — YIN kadang mengunci satu oktaf terlalu tinggi pada
  // senar tebal. Kalau kelipatan tau punya lembah yang hampir sama dalamnya,
  // periode yang lebih panjang itulah nada dasar yang sebenarnya.
  for (let k = 2; k <= 3; k++){
    const t0 = Math.round(tau * k);
    if (t0 >= maxTau - 2) break;
    let bt = t0;
    const lo = Math.max(minTau, t0 - 3), hi = Math.min(maxTau - 2, t0 + 3);
    for (let t = lo; t <= hi; t++) if (cm[t] < cm[bt]) bt = t;
    if (cm[bt] < cm[tau] * 1.12 && cm[bt] < 0.20){ tau = bt; break; }
  }

  const x0 = cm[tau - 1] ?? cm[tau], x2 = cm[tau + 1] ?? cm[tau];   // (d) parabolik
  const a = (x0 + x2 - 2 * cm[tau]) / 2, b = (x2 - x0) / 2;
  const refined = a !== 0 ? tau - b / (2 * a) : tau;

  const freq = sr / refined;
  return (freq >= detMinF && freq <= detMaxF) ? freq : -1;
}

/* ============================================================
   4. GEOMETRI BILAH CENT
   Mendatar: −50 cent di kiri, 0 di tengah, +50 di kanan.
   SPAN 46 menyisakan tepi 4% supaya penanda tidak terpotong.
   ============================================================ */
const SPAN = 46;
const centsToPct = c => 50 + Math.max(-50, Math.min(50, c)) / 50 * SPAN;
const f2 = n => n.toFixed(2);

/* ============================================================
   5. STATE + UI
   ============================================================ */
const _els = new Map();
const $ = id => {
  let el = _els.get(id);
  if (el === undefined){ el = document.getElementById(id); _els.set(id, el); }
  return el;
};
let instrument = "gitar", presetIndex = 0, strings = [];
let running = false, audioCtx = null, analyser = null, micStream = null, sampleBuf = null;
let wantPct = 50, viewPct = 50, history = [], lastSeen = 0, rafId = 0, lastDetect = 0;
let mode = "needle", strobeSpeed = 0, sOff1 = 0, sOff2 = 0, lastFrame = 0;
let lockedIndex = -1, hpNode = null, lpNode = null, wakeLock = null, lastLvl = "";

/* ---------- pengaturan tersimpan ---------- */
const LS_KEY = "chelebes.tuner.v1";
function saveSettings(){
  try { localStorage.setItem(LS_KEY,
    JSON.stringify({ instrument, presetIndex, A4, mode })); } catch(e){}
}
function loadSettings(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    if (s.instrument && INSTRUMENTS[s.instrument]) instrument = s.instrument;
    const n = INSTRUMENTS[instrument].presets.length;
    if (Number.isInteger(s.presetIndex) && s.presetIndex >= 0 && s.presetIndex < n)
      presetIndex = s.presetIndex;
    if (typeof s.A4 === "number" && isFinite(s.A4)) A4 = Math.max(430, Math.min(450, s.A4));
    if (s.mode === "needle" || s.mode === "strobe") mode = s.mode;
  } catch(e){}
}

/* ---------- batas frekuensi per instrumen ---------- */
function updateBandLimits(){
  const lo = Math.min(...strings.map(s => s.freq));
  const hi = Math.max(...strings.map(s => s.freq));
  detMinF = lo * 0.70;
  detMaxF = hi * 2.20;
  if (hpNode) hpNode.frequency.value = Math.max(20, lo * 0.72);
  if (lpNode) lpNode.frequency.value = Math.min(6000, Math.max(1200, hi * 2.6));
}

const currentPreset = () => INSTRUMENTS[instrument].presets[presetIndex];

function buildGauge(){
  let t = "";
  for (let c = -50; c <= 50; c += 5){
    const mj = c % 25 === 0;
    t += `<i class="${mj ? "mj" : ""}" style="left:${c + 50}%;height:${mj ? 16 : 9}px"></i>`;
  }
  $("gaugeTicks").innerHTML = t;
}

function buildTabs(){
  $("tabs").innerHTML = Object.entries(INSTRUMENTS).map(([k, v]) =>
    `<button role="tab" data-k="${k}" aria-selected="${k === instrument}">${v.label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => {
    instrument = b.dataset.k; presetIndex = 0;
    buildTabs(); buildPresets(); buildStrings();
    resetDisplay(); saveSettings();
  });
}

function buildPresets(){
  $("preset").innerHTML = INSTRUMENTS[instrument].presets
    .map((p, i) => `<option value="${i}"${i === presetIndex ? " selected" : ""}>${p.name}</option>`).join("");
}

function buildStrings(){
  strings = currentPreset().midi.map(m => {
    const { name, oct } = midiToName(m);
    return { midi:m, label:name + oct, freq:midiToFreq(m) };
  });
  lockedIndex = -1;
  updateBandLimits();

  if (INSTRUMENTS[instrument].icon === "violin") buildFingerboard();
  else buildHeadstock();

  $("strings").querySelectorAll(".sstr").forEach(el => {
    el.onclick = () => pickString(+el.dataset.i);
    el.onkeydown = e => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pickString(+el.dataset.i); }
    };
  });
}

function buildChips(){
  $("strings").className = "strings";
  $("strings").innerHTML = strings.map((s, i) =>
    `<button class="chip sstr" data-i="${i}" aria-label="Nada acuan ${s.label}">
       <span class="n">${s.label}</span><span class="f">${s.freq.toFixed(1)}</span>
     </button>`).join("");
}

/* Papan jari biola: senar melengkung menyebar dari nut yang sempit
   ke arah bawah yang melebar, seperti fingerboard sungguhan. */
function buildFingerboard(){
  const n = strings.length;
  const topL = 142, topR = 198, botL = 74, botR = 266;
  const tx = i => topL + (topR - topL) * (i + .5) / n;
  const bx = i => botL + (botR - botL) * (i + .5) / n;

  const parts = strings.map((s, i) => {
    const x1 = tx(i), x2 = bx(i);
    const w  = 1.0 + (n - 1 - i) * 0.55;                 // senar bawah lebih tebal
    const c1 = x1 + (x2 - x1) * .12, c2 = x1 + (x2 - x1) * .64;
    const ln = `M${x1.toFixed(1)} 20 C${c1.toFixed(1)} 58 ${c2.toFixed(1)} 92 ${x2.toFixed(1)} 116`;
    const hit = `M${(x1 - 6).toFixed(1)} 8 L${(x1 + 6).toFixed(1)} 8 ` +
                `L${(x2 + 22).toFixed(1)} 150 L${(x2 - 22).toFixed(1)} 150 Z`;
    return `<g class="fstr sstr" data-i="${i}" tabindex="0" role="button"
               aria-label="Nada acuan ${s.label}">
      <path class="hit" d="${hit}"/>
      <path class="ln" d="${ln}" fill="none" stroke-width="${w.toFixed(2)}"/>
      <text class="lb" x="${x2.toFixed(1)}" y="134">${s.label}</text>
      <text class="hz" x="${x2.toFixed(1)}" y="146">${s.freq.toFixed(1)}</text>
      <text class="lk" x="${x1.toFixed(1)}" y="6">●</text>
    </g>`;
  }).join("");

  $("strings").className = "";
  $("strings").innerHTML =
   `<svg class="fb" viewBox="0 0 340 152" role="group" aria-label="Papan jari">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2A1E15"/><stop offset=".40" stop-color="#41301F"/>
          <stop offset=".68" stop-color="#2E2116"/><stop offset="1" stop-color="#191009"/>
        </linearGradient>
      </defs>
      <path d="M140 16 L200 16 L268 120 L72 120 Z" fill="url(#wood)"
            stroke="rgba(224,174,92,.28)" stroke-width="1"/>
      <rect x="136" y="9" width="68" height="7.5" rx="3"
            fill="#D9CFC0" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
      ${parts}
    </svg>`;
}

/* Kepala gitar / bass / ukulele: pasak kuningan seperti alat aslinya.
   Ketuk pasak atau labelnya untuk membunyikan nada acuan sekaligus mengunci senar. */
function buildHeadstock(){
  const n = strings.length;
  const inline = instrument === "bass";          // bass: pasak sebaris di satu sisi
  const pegs = [];
  if (inline){
    const y0 = 16, y1 = 74;
    for (let i = 0; i < n; i++)
      pegs.push({ px:164, bx:112, side:-1, py: n > 1 ? y0 + (y1 - y0) * i / (n - 1) : 45 });
  } else {                                       // gitar 3+3, ukulele 2+2
    const half = Math.ceil(n / 2);
    const py = k => half > 1 ? 20 + (48 / (half - 1)) * k : 44;
    for (let i = 0; i < n; i++)
      pegs.push(i < half ? { px:164, bx:112, side:-1, py: py(i) }
                         : { px:236, bx:252, side: 1, py: py(n - 1 - i) });
  }

  const nutX = i => 146 + 108 * (i + .5) / n;
  const botX = i =>  80 + 240 * (i + .5) / n;

  const parts = strings.map((s, i) => {
    const p = pegs[i], nx = nutX(i), bx = botX(i);
    const w  = 1.0 + (n - 1 - i) * 0.45;               // senar bawah lebih tebal
    const cn = p.side < 0 ? p.bx + 36 : p.bx - 16;     // batang penghubung pasak
    const ln = `M${p.px} ${p.py.toFixed(1)} C${p.px} ${(p.py + 14).toFixed(1)} ` +
               `${nx.toFixed(1)} 66 ${nx.toFixed(1)} 84 L${bx.toFixed(1)} 168`;
    return `<g class="hstr sstr" data-i="${i}" tabindex="0" role="button"
               aria-label="Nada acuan ${s.label}">
      <rect class="hit" x="${p.side < 0 ? 96 : 224}" y="${(p.py - 12).toFixed(1)}" width="80" height="24"/>
      <rect class="hit" x="${(bx - 28).toFixed(1)}" y="158" width="56" height="42"/>
      <path class="ln" d="${ln}" fill="none" stroke-width="${w.toFixed(2)}"/>
      <rect class="pb" x="${cn}" y="${(p.py - 2).toFixed(1)}" width="16" height="4" rx="2"/>
      <rect class="pb" x="${p.bx}" y="${(p.py - 5).toFixed(1)}" width="36" height="10" rx="3"/>
      <circle class="peg" cx="${p.px}" cy="${p.py.toFixed(1)}" r="5"/>
      <text class="lb" x="${bx.toFixed(1)}" y="186">${s.label}</text>
      <text class="hz" x="${bx.toFixed(1)}" y="196">${s.freq.toFixed(1)}</text>
      <text class="lk" x="${p.px}" y="${(p.py - 9).toFixed(1)}">●</text>
    </g>`;
  }).join("");

  $("strings").className = "";
  $("strings").innerHTML =
   `<svg class="hs" viewBox="0 0 400 200" role="group"
         aria-label="Kepala ${INSTRUMENTS[instrument].label}">
      <defs>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#3B2A1B"/><stop offset=".40" stop-color="#5A4229"/>
          <stop offset=".68" stop-color="#42301E"/><stop offset="1" stop-color="#251A10"/>
        </linearGradient>
        <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#312417"/><stop offset=".45" stop-color="#4E3925"/>
          <stop offset="1" stop-color="#1F160E"/>
        </linearGradient>
      </defs>
      <path d="M142 84 L258 84 L330 168 L70 168 Z" fill="url(#wood2)"
            stroke="rgba(224,174,92,.32)" stroke-width="1"/>
      <path d="M136 6 L264 6 L258 78 L142 78 Z" fill="url(#wood)"
            stroke="rgba(224,174,92,.45)" stroke-width="1.2"/>
      <g fill="none" stroke="#E0AE5C" stroke-width="1.1" opacity=".45">
        <path d="M200 22 L222 44 L200 66 L178 44 Z"/>
        <path d="M200 34 L210 44 L200 54 L190 44 Z"/>
      </g>
      <rect x="138" y="76" width="124" height="8" rx="3"
            fill="#D9CFC0" stroke="rgba(0,0,0,.45)" stroke-width=".8"/>
      ${parts}
    </svg>`;
}

/* Ketuk senar: bunyikan nada acuan sekaligus kunci / lepas kunci. */
function pickString(i){
  lockedIndex = (lockedIndex === i) ? -1 : i;
  paintLock();
  playTone(strings[i].freq);
  $("status").className = "status";
  $("status").textContent = lockedIndex < 0
    ? "Kunci dilepas — senar dideteksi otomatis lagi."
    : `Terkunci di senar ${strings[i].label}. Ketuk lagi untuk melepas.`;
}

function paintLock(){
  document.querySelectorAll(".sstr").forEach(el =>
    el.classList.toggle("locked", +el.dataset.i === lockedIndex));
}

/* ---------- layar tetap menyala ---------- */
async function acquireWakeLock(){
  try {
    if ("wakeLock" in navigator && !wakeLock)
      wakeLock = await navigator.wakeLock.request("screen");
  } catch(e){}
}
function releaseWakeLock(){
  try { if (wakeLock) wakeLock.release(); } catch(e){}
  wakeLock = null;
}

/* ---------- mode tampilan: jarum / strobo ---------- */
function setMode(m){
  mode = m;
  $("modes").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.m === m)));
  $("gaugeGroup").style.display  = m === "needle" ? "" : "none";
  $("strobeGroup").style.display = m === "strobe" ? "flex" : "none";
  if (!running) $("status").textContent = m === "strobe"
    ? "Strobo: pola berhenti bergeser = nada sudah pas."
    : "Ketuk senar untuk mendengar nada acuan.";
  saveSettings();
}

function resetDisplay(){
  history = []; wantPct = 50; strobeSpeed = 0;
  $("dTarget").textContent = "—";
  $("dNote").textContent = "—";
  $("dNote").style.color = "#FBF0DC";
  $("dHz").textContent = running ? "petik satu senar…" : "tekan MULAI";
  $("dCents").textContent = "";
  $("dCents").style.color = "rgba(245,233,214,.70)";
  $("needle").style.background = "#FBEFD6";
  $("needle").style.boxShadow  = "0 0 12px 3px rgba(224,174,92,.70)";
  $("needleG").style.left = "50%";
  $("strobeBand1").style.setProperty("--sc", "#E6D6B6");
  $("strobeBand2").style.setProperty("--sc", "#A89270");
  document.querySelectorAll(".sstr").forEach(el => el.classList.remove("active", "tuned"));
}

/* ---------- nada acuan ---------- */
async function playTone(freq){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "triangle"; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 1.45);
}

/* ---------- mikrofon ---------- */
async function start(){
  try {
    $("status").className = "status";
    $("status").textContent = "Meminta izin mikrofon…";

    micStream = await navigator.mediaDevices.getUserMedia({ audio:{
      echoCancellation:false,   // WAJIB false — kalau tidak, pitch jadi kacau
      noiseSuppression:false,
      autoGainControl:false,
    }});

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();    // iOS: harus setelah tap user

    const src = audioCtx.createMediaStreamSource(micStream);
    hpNode = audioCtx.createBiquadFilter(); hpNode.type = "highpass"; hpNode.Q.value = 0.7;
    lpNode = audioCtx.createBiquadFilter(); lpNode.type = "lowpass";  lpNode.Q.value = 0.7;
    updateBandLimits();                      // batas menyesuaikan instrumen aktif
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 4096;
    src.connect(hpNode).connect(lpNode).connect(analyser);
    sampleBuf = new Float32Array(analyser.fftSize);

    running = true;
    lastFrame = 0;
    acquireWakeLock();
    $("start").textContent = "BERHENTI";
    $("start").classList.add("on");
    $("status").textContent = "Mendengarkan… petik satu senar.";
    resetDisplay(); loop();
  } catch (e){
    $("status").className = "status err";
    $("status").textContent = "Mikrofon ditolak / tidak tersedia. Pastikan halaman dibuka lewat HTTPS.";
  }
}

function stop(){
  running = false;
  cancelAnimationFrame(rafId);
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null; analyser = null; hpNode = null; lpNode = null;
  releaseWakeLock();
  lastRms = 0; lastLvl = "0"; $("lvl").style.transform = "scaleX(0)";
  $("start").textContent = "MULAI";
  $("start").classList.remove("on");
  $("status").className = "status";
  $("status").textContent = "Ketuk senar untuk mendengar nada acuan.";
  resetDisplay();
}

/* ---------- loop utama ---------- */
function loop(){
  if (!running) return;
  rafId = requestAnimationFrame(loop);

  const now = performance.now();
  if (now - lastDetect > 70 && analyser){
    lastDetect = now;
    analyser.getFloatTimeDomainData(sampleBuf);
    const freq = detectPitch(sampleBuf, audioCtx.sampleRate);

    if (freq > 0){
      history.push(freq);
      if (history.length > 5) history.shift();
      render([...history].sort((a, b) => a - b)[history.length >> 1]);
      lastSeen = now;
    } else if (now - lastSeen > 1200){
      resetDisplay();
    }
  }

  // indikator kekuatan sinyal (skala desibel supaya terasa alami)
  const pct = lastRms > 0
    ? Math.max(0, Math.min(100, (20 * Math.log10(lastRms) + 62) / 62 * 100)) : 0;
  const lvlS = (pct / 100).toFixed(3);
  if (lvlS !== lastLvl){ lastLvl = lvlS; $("lvl").style.transform = "scaleX(" + lvlS + ")"; }

  const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
  lastFrame = now;

  if (mode === "needle"){
    viewPct += (wantPct - viewPct) * 0.3;                     // penanda bergerak halus
    $("needleG").style.left = viewPct.toFixed(2) + "%";
  } else {
    // Strobo: laju geser pita sebanding selisih cent.
    // Diam = pas · bergeser ke kanan = ketinggian · ke kiri = kerendahan.
    sOff1 = (sOff1 + strobeSpeed * dt) % 28;
    sOff2 = (sOff2 + strobeSpeed * dt) % 20;
    $("strobeBand1").style.backgroundPositionX = sOff1.toFixed(2) + "px";
    $("strobeBand2").style.backgroundPositionX = sOff2.toFixed(2) + "px";
  }
}

/* ---------- tampilkan hasil ---------- */
function render(freq){
  let best;
  if (lockedIndex >= 0 && strings[lockedIndex]){
    best = strings[lockedIndex];              // senar dikunci manual
  } else {
    best = strings[0];
    let bestAbs = Infinity;
    for (const s of strings){
      const c = Math.abs(centsBetween(freq, s.freq));
      if (c < bestAbs){ bestAbs = c; best = s; }
    }
  }
  const cents  = centsBetween(freq, best.freq);
  const inTune = Math.abs(cents) < 5;
  const close  = Math.abs(cents) < 15;
  const color  = inTune ? "#7FE0A6" : close ? "#F0BC6E" : "#F08C79";
  const glow   = inTune ? "rgba(111,199,154,.55)" : close ? "rgba(224,174,92,.55)" : "rgba(232,131,111,.50)";

  const nm = midiToName(best.midi);
  $("dTarget").textContent = "SENAR " + best.label;
  $("dNote").textContent   = nm.name + nm.oct;
  $("dNote").style.color = color;
  $("dHz").textContent     = freq.toFixed(1) + " Hz · target " + best.freq.toFixed(1);
  $("dCents").textContent  = inTune ? "PAS ✓"
    : Math.abs(cents) > 99 ? (cents < 0 ? "JAUH DI BAWAH" : "JAUH DI ATAS")
    : (cents < 0 ? "RENDAH " : "TINGGI ") + (cents > 0 ? "+" : "") + cents.toFixed(0) + " CENT";
  $("dCents").style.color = inTune ? "#7FE0A6" : "rgba(245,233,214,.70)";

  $("needle").style.background = color;
  $("needle").style.boxShadow  = "0 0 12px 3px " + glow;
  wantPct = centsToPct(cents);
  strobeSpeed = Math.max(-260, Math.min(260, cents * 5));
  $("strobeBand1").style.setProperty("--sc", inTune ? "#9FEEC2" : close ? "#F2D9A6" : "#E6D6B6");
  $("strobeBand2").style.setProperty("--sc", inTune ? "#5FB287" : close ? "#C7A265" : "#A89270");

  document.querySelectorAll(".sstr").forEach(el => {
    const s = strings[+el.dataset.i];
    el.classList.toggle("active", s.midi === best.midi && !inTune);
    el.classList.toggle("tuned",  s.midi === best.midi && inTune);
  });

  if (inTune && navigator.vibrate) navigator.vibrate(18);
}

/* ---------- kalibrasi A4 ---------- */
function setA4(v){
  A4 = Math.max(430, Math.min(450, v));
  $("a4v").textContent = A4;
  buildStrings();
  saveSettings();
}

/* ---------- wiring ---------- */
$("preset").onchange = e => {
  presetIndex = +e.target.value;
  buildStrings(); resetDisplay(); saveSettings();
};

/* Kembali dari layar terkunci / tab lain: hidupkan lagi audio dan wake lock. */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !running) return;
  if (audioCtx && audioCtx.state === "suspended"){
    try { await audioCtx.resume(); } catch(e){}
  }
  acquireWakeLock();
});
$("modes").querySelectorAll("button").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("start").onclick   = () => running ? stop() : start();
$("a4up").onclick    = () => setA4(A4 + 1);
$("a4dn").onclick    = () => setA4(A4 - 1);

loadSettings();
buildGauge(); buildTabs(); buildPresets(); buildStrings();
setMode(mode); resetDisplay();
$("a4v").textContent = A4;

/* pekerja layanan: bisa dipakai offline setelah sekali dibuka */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker
      .register("sw.js", { updateViaCache: "none" })   // selalu cek versi baru
      .catch(() => {}));
}

/* pratinjau tanpa mikrofon: tambahkan ?demo=1 di URL */
if (new URLSearchParams(location.search).get("demo")){
  if (new URLSearchParams(location.search).get("strobe")) setMode("strobe");
  render(midiToFreq(45) * Math.pow(2, -11 / 1200));
  viewPct = wantPct;
  $("needleG").style.left = wantPct.toFixed(2) + "%";
}
</script>
</body>
